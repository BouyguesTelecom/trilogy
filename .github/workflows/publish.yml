name: Publish to NPM

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Extract version tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Detect prerelease version
          if [[ "$VERSION" == *"-"* ]]; then
            TAG_SUFFIX="${VERSION#*-}"
            echo "NPM_TAG=$TAG_SUFFIX" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Install dependencies & build
        run: |
          npm i --legacy-peer-deps
          npm run build

      - name: Tests
        run: |
          npm run lint
          npm run test
          npm run check-types
          npm run test:native

      # ==========================================
      # 1. PUBLISH REACT
      # ==========================================
      - name: Publish React package on NPMJS Registry 📦
        run: |
          cd packages/react
          npm version --no-git-tag-version "$VERSION" || echo "Version already set"
          PKG_NAME=$(node -p "require('./package.json').name")
          
          # Vérification si déjà publié
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "⚠️ $PKG_NAME@$VERSION est déjà publié sur NPM. Étape ignorée."
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              npm publish --access public --tag "$NPM_TAG" --provenance
            else
              npm publish --access public --provenance
            fi
          fi

      # ==========================================
      # 2. PUBLISH ASSETS
      # ==========================================
      - name: Publish Assets package on NPM 📦
        run: |
          cd packages/assets
          npm version --no-git-tag-version "$VERSION" || echo "Version already set"
          PKG_NAME=$(node -p "require('./package.json').name")
          
          # Vérification si déjà publié
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "⚠️ $PKG_NAME@$VERSION est déjà publié sur NPM. Étape ignorée."
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              npm publish --access public --tag "$NPM_TAG" --provenance
            else
              npm publish --access public --provenance
            fi
          fi

      # ==========================================
      # 3. PUBLISH STYLES
      # ==========================================
      - name: Publish Styles package on NPM 📦
        run: |
          cd packages/styles
          npm version --no-git-tag-version "$VERSION" || echo "Version already set"
          PKG_NAME=$(node -p "require('./package.json').name")
          
          # Vérification si déjà publié
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "⚠️ $PKG_NAME@$VERSION est déjà publié sur NPM. Étape ignorée."
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              npm publish --access public --tag "$NPM_TAG" --provenance
            else
              npm publish --access public --provenance
            fi
          fi

      # ==========================================
      # 4. PUBLISH VANILLA
      # ==========================================
      - name: Publish Vanilla package on NPM 📦
        run: |
          cd packages/vanilla
          npm version --no-git-tag-version "$VERSION" || echo "Version already set"
          PKG_NAME=$(node -p "require('./package.json').name")
          
          # Vérification si déjà publié
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "⚠️ $PKG_NAME@$VERSION est déjà publié sur NPM. Étape ignorée."
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              npm publish --access public --tag "$NPM_TAG" --provenance
            else
              npm publish --access public --provenance
            fi
          fi

      # ==========================================
      # 5. PUBLISH LOCALE (EN)
      # ==========================================
      - name: Publish Locale package (en) on NPM 📦
        run: |
          cd packages/locales/en
          npm version --no-git-tag-version "${VERSION}-en" || echo "Version already set"
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          
          # Vérification si déjà publié
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "⚠️ $PKG_NAME@$PKG_VERSION est déjà publié sur NPM. Étape ignorée."
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              npm publish --access public --tag "${NPM_TAG}-en" --provenance
            else
              npm publish --access public --tag en --provenance
            fi
          fi

      # ==========================================
      # 6. PUBLISH LOCALE (FR)
      # ==========================================
      - name: Publish Locale package (fr) on NPM 📦
        run: |
          cd packages/locales/fr
          npm version --no-git-tag-version "${VERSION}-fr" || echo "Version already set"
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          
          # Vérification si déjà publié
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "⚠️ $PKG_NAME@$PKG_VERSION est déjà publié sur NPM. Étape ignorée."
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              npm publish --access public --tag "${NPM_TAG}-fr" --provenance
            else
              npm publish --access public --tag fr --provenance
            fi
          fi