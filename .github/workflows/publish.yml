name: Publish to NPM

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Extract version tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Detect prerelease version
          if [[ "$VERSION" == *"-"* ]]; then
            TAG_SUFFIX="${VERSION#*-}"
            echo "NPM_TAG=$TAG_SUFFIX" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Change version for React package 📌
        run: |
          npm version --workspace packages/react --no-git-tag-version "$VERSION" \
          || echo "Version already set, continuing..."

      - name: Install dependencies & build
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Tests
        run: |
          npm run lint
          npm run test
          npm run check-types
          npm run test:native

      - name: Publish React package on NPMJS Registry 📦
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish --workspace packages/react --access public --tag "$NPM_TAG" --provenance
          else
            npm publish --workspace packages/react --access public --provenance
          fi

      - name: Publish Assets package on NPM 📦
        run: |
          npm version --workspace packages/assets --no-git-tag-version "$VERSION" \
          || echo "Version already set"
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish --workspace packages/assets --access public --tag "$NPM_TAG" --provenance
          else
            npm publish --workspace packages/assets --access public --provenance
          fi

      - name: Publish Styles package on NPM 📦
        run: |
          npm version --workspace packages/styles --no-git-tag-version "$VERSION" \
          || echo "Version already set"
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish --workspace packages/styles --access public --tag "$NPM_TAG" --provenance
          else
            npm publish --workspace packages/styles --access public --provenance
          fi

      - name: Publish Vanilla package on NPM 📦
        run: |
          npm version --workspace packages/vanilla --no-git-tag-version "$VERSION" \
          || echo "Version already set"
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish --workspace packages/vanilla --access public --tag "$NPM_TAG" --provenance
          else
            npm publish --workspace packages/vanilla --access public --provenance
          fi

      - name: Publish Locale package (en) on NPM 📦
        run: |
          npm version --prefix packages/locales/en --no-git-tag-version "${VERSION}-en" \
          || echo "Version already set"
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish packages/locales/en --access public --tag "${NPM_TAG}-en" --provenance
          else
            npm publish packages/locales/en --access public --tag en --provenance
          fi

      - name: Publish Locale package (fr) on NPM 📦
        run: |
          npm version --prefix packages/locales/fr --no-git-tag-version "${VERSION}-fr" \
          || echo "Version already set"
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish packages/locales/fr --access public --tag "${NPM_TAG}-fr" --provenance
          else
            npm publish packages/locales/fr --access public --tag fr --provenance
          fi
