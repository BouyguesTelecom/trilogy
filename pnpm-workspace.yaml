packages:
  - "apps/*"
  - "packages/*"
  - "!**/test/**"
  - "!**/fixtures/**"
  - "!**/temp/**"
  - "!packages/tests/temp/**"
  - "!apps/*/.contentlayer"
  - "!apps/*/.next"
  - "!apps/*/.source"
  - "!apps/*/.turbo"

minimumReleaseAge: 2880

catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  react-native: 0.88.0
  typescript: 7.0.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0

allowBuilds:
  "@parcel/watcher": false
  unrs-resolver: true
